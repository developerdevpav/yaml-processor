databaseChangeLog:
  - changeSet:
      id: 003-jsonlogic-rules-unbounded
      author: Pavel Talaika
      changes:
        - modifyDataType:
            tableName: subprocess
            columnName: trigger_rule
            newDataType: CLOB
        - modifyDataType:
            tableName: configurator
            columnName: filter_event_rule
            newDataType: CLOB
        - modifyDataType:
            tableName: reverse_output
            columnName: rule
