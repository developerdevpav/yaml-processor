spring:
  application:
    name: yaml-processor
  
  # Настройки для работы с YAML файлами
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: NON_NULL
  
  datasource:
    # Файловая БД: ./data/yaml_processor.mv.db относительно рабочей директории процесса
    url: jdbc:h2:file:./data/yaml_processor;MODE=PostgreSQL;AUTO_SERVER=TRUE
    driverClassName: org.h2.Driver
    username: sa
    password:

  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true

  graphql:
    graphiql:
      enabled: false

  ai:
    mcp:
      server:
        protocol: STREAMABLE
        name: yaml-processor
        version: 1.0.0
        type: SYNC
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false
        streamable-http:
          mcp-endpoint: /mcp

# Настройки приложения
app:
  yaml:
    directory: ./yaml-files
    schema-file: ./schema.json

# Настройки сервера
server:
  port: 8080
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
