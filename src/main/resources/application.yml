spring:
  application:
    name: yaml-processor
  
  # Настройки для работы с YAML файлами
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: NON_NULL
  
  # Настройки Thymeleaf
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false

  datasource:
    # Файловая БД: ./data/yaml_processor.mv.db относительно рабочей директории процесса
    url: jdbc:h2:file:./data/yaml_processor;MODE=PostgreSQL;AUTO_SERVER=TRUE
    driverClassName: org.h2.Driver
    username: sa
    password:

  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true

# Настройки приложения
app:
  yaml:
    directory: ./yaml-files
    schema-file: ./schema.json

# Настройки сервера
server:
  port: 8080
  servlet:
    context-path: /
