databaseChangeLog:
  - changeSet:
      id: 002-dictionary-tables
      author: Codex
      changes:
        - createTable:
            tableName: dict_b3_status
            columns:
              - column:
                  name: code
                  type: VARCHAR(64)
                  constraints:
                    primaryKey: true
                    nullable: false
        - createTable:
            tableName: dict_action_phases
            columns:
              - column:
                  name: code
                  type: VARCHAR(64)
                  constraints:
                    primaryKey: true
                    nullable: false
        - createTable:
            tableName: dict_sla_status
            columns:
              - column:
                  name: code
                  type: VARCHAR(64)
                  constraints:
                    primaryKey: true
                    nullable: false
        - createTable:
            tableName: dict_context_codes
            columns:
              - column:
                  name: code
                  type: VARCHAR(64)
                  constraints:
                    primaryKey: true
                    nullable: false
        - createTable:
            tableName: dict_sla_duration_unit
            columns:
              - column:
                  name: code
                  type: VARCHAR(64)
                  constraints:
                    primaryKey: true
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: process
            baseColumnNames: context_code
            constraintName: fk_process_context_code_dict
            referencedTableName: dict_context_codes
            referencedColumnNames: code
        - addForeignKeyConstraint:
            baseTableName: subprocess
            baseColumnNames: context_code
            constraintName: fk_subprocess_context_code_dict
            referencedTableName: dict_context_codes
            referencedColumnNames: code
        - addForeignKeyConstraint:
            baseTableName: stage
            baseColumnNames: context_code
            constraintName: fk_stage_context_code_dict
            referencedTableName: dict_context_codes
            referencedColumnNames: code
        - addForeignKeyConstraint:
            baseTableName: reverse_entry
            baseColumnNames: b3_status
            constraintName: fk_reverse_entry_b3_status_dict
            referencedTableName: dict_b3_status
            referencedColumnNames: code
        - addForeignKeyConstraint:
            baseTableName: reverse_output
            baseColumnNames: phase
            constraintName: fk_reverse_output_phase_dict
            referencedTableName: dict_action_phases
            referencedColumnNames: code
        - addForeignKeyConstraint:
            baseTableName: reverse_output
            baseColumnNames: body_service_sla_status
            constraintName: fk_reverse_output_sla_status_dict
            referencedTableName: dict_sla_status
            referencedColumnNames: code
        - addForeignKeyConstraint:
            baseTableName: reverse_output
            baseColumnNames: body_service_sla_duration_unit
            constraintName: fk_reverse_output_sla_duration_unit_dict
            referencedTableName: dict_sla_duration_unit
            referencedColumnNames: code

