<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${filename} ? 'Редактирование ' + ${filename} : 'Создание нового файла'">Редактирование YAML</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --black: #000000;
            --white: #ffffff;
            --gray-100: #f8f9fa;
            --gray-200: #e9ecef;
            --gray-300: #dee2e6;
            --gray-400: #ced4da;
            --gray-500: #adb5bd;
            --gray-600: #6c757d;
            --gray-700: #495057;
            --gray-800: #343a40;
            --gray-900: #212529;
        }

        * {
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--white);
            color: var(--black);
            min-height: 100vh;
        }

        .navbar {
            background: var(--white) !important;
            border-bottom: 1px solid var(--black);
        }

        .navbar-brand {
            font-weight: 400;
            font-size: 1.5rem;
            color: var(--black);
        }

        .nav-link {
            color: var(--gray-700) !important;
            font-weight: 400;
            transition: all 0.2s ease;
            position: relative;
        }

        .nav-link:hover {
            color: var(--black) !important;
        }

        .nav-link::after {
            content: '';
            position: absolute;
            width: 0;
            height: 1px;
            bottom: -5px;
            left: 50%;
            background: var(--black);
            transition: all 0.2s ease;
            transform: translateX(-50%);
        }

        .nav-link:hover::after {
            width: 100%;
        }

        .container {
            position: relative;
            z-index: 1;
        }

        .main-card {
            background: var(--white);
            border: 1px solid var(--black);
            margin-top: 2rem;
            overflow: hidden;
        }

        .page-header {
            background: var(--black);
            color: var(--white);
            padding: 1.5rem;
            margin: -1px -1px 0 -1px;
        }

        .page-header h2 {
            font-weight: 400;
            margin: 0;
            font-size: 1.5rem;
        }

        .btn-modern {
            background: var(--white);
            border: 1px solid var(--black);
            padding: 8px 16px;
            font-weight: 400;
            color: var(--black);
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-modern:hover {
            background: var(--black);
            color: var(--white);
            text-decoration: none;
        }

        .btn-secondary-modern {
            background: var(--white);
            border: 1px solid var(--black);
            padding: 8px 16px;
            font-weight: 400;
            color: var(--black);
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-secondary-modern:hover {
            background: var(--black);
            color: var(--white);
            text-decoration: none;
        }

        .form-section {
            background: var(--white);
            border: 1px solid var(--black);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            transition: all 0.2s ease;
        }

        .form-section:hover {
            border-color: var(--gray-500);
        }

        .form-section h5 {
            color: var(--black);
            margin-bottom: 1rem;
            font-weight: 400;
            position: relative;
        }

        .form-section h5::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 30px;
            height: 1px;
            background: var(--black);
        }

        .form-label {
            color: var(--black);
            font-weight: 400;
            margin-bottom: 0.5rem;
        }

        .form-control, .form-select {
            background: var(--white);
            border: 1px solid var(--black);
            color: var(--black);
            padding: 8px 12px;
            transition: all 0.2s ease;
        }

        .form-control:focus, .form-select:focus {
            background: var(--white);
            border-color: var(--gray-500);
            box-shadow: none;
            color: var(--black);
        }

        .form-control::placeholder {
            color: var(--gray-500);
        }

        .form-check-input {
            background: var(--white);
            border: 1px solid var(--black);
        }

        .form-check-input:checked {
            background: var(--black);
            border-color: var(--black);
        }

        .form-check-label {
            color: var(--black);
            font-weight: 400;
        }

        .array-item {
            background: var(--white);
            border: 1px solid var(--black);
            padding: 1rem;
            margin-bottom: 1rem;
            transition: all 0.2s ease;
            position: relative;
        }

        .array-item:hover {
            border-color: var(--gray-500);
        }

        .array-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .array-item-header h6 {
            color: var(--black);
            font-weight: 400;
            margin: 0;
        }

        .remove-item-btn {
            background: var(--white);
            border: 1px solid var(--black);
            padding: 4px 8px;
            color: var(--black);
            transition: all 0.2s ease;
        }

        .remove-item-btn:hover {
            background: var(--black);
            color: var(--white);
        }

        .btn-add {
            background: var(--white);
            border: 1px solid var(--black);
            padding: 6px 12px;
            color: var(--black);
            font-weight: 400;
            transition: all 0.2s ease;
        }

        .btn-add:hover {
            background: var(--black);
            color: var(--white);
        }

        .alert-modern {
            border: 1px solid var(--black);
        }

        .alert-success {
            background: var(--white);
            color: var(--black);
            border-color: var(--black);
        }

        .alert-danger {
            background: var(--white);
            color: var(--black);
            border-color: var(--black);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in-up {
            animation: fadeInUp 0.6s ease-out;
        }

        .stagger-1 { animation-delay: 0.1s; }
        .stagger-2 { animation-delay: 0.2s; }
        .stagger-3 { animation-delay: 0.3s; }
        .stagger-4 { animation-delay: 0.4s; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-file-code me-2"></i>YAML Processor
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/yaml">
                    <i class="fas fa-list me-1"></i>Список файлов
                </a>
                <a class="nav-link" href="/yaml/new">
                    <i class="fas fa-plus me-1"></i>Новый файл
                </a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div th:if="${success}" class="alert alert-success alert-modern alert-dismissible fade show fade-in-up" role="alert">
            <i class="fas fa-check-circle me-2"></i>
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div th:if="${error}" class="alert alert-danger alert-modern alert-dismissible fade show fade-in-up" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i>
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="main-card fade-in-up">
            <div class="page-header">
                <div class="d-flex justify-content-between align-items-center">
                    <h2>
                        <i class="fas fa-edit me-3"></i>
                        <span th:text="${filename} ? 'Редактирование: ' + ${filename} : 'Создание нового файла'"></span>
                    </h2>
                    <div>
                        <a href="/yaml" class="btn-secondary-modern me-2">
                            Назад к списку
                        </a>
                        <button type="submit" form="yamlForm" class="btn-modern">
                            Сохранить
                        </button>
                    </div>
                </div>
            </div>

            <div class="p-4">

        <form id="yamlForm" th:action="@{/yaml/save}" th:object="${processConfig}" method="post">
            <input type="hidden" th:name="filename" th:value="${filename}">
            
            <!-- Основная информация о процессе -->
            <div class="form-section">
                <h5><i class="fas fa-cog me-2"></i>Основная информация</h5>
                <div class="row">
                    <div class="col-md-6">
                        <label for="processId" class="form-label">ID процесса</label>
                        <input type="text" class="form-control" id="processId" th:field="*{process.id}" placeholder="Введите ID процесса">
                    </div>
                    <div class="col-md-6">
                        <label for="processContextCode" class="form-label">Код контекста</label>
                        <select class="form-select enum-select" id="processContextCode" th:field="*{process.contextCode}">
                            <option value="">Выберите код контекста</option>
                            <option th:each="code : ${T(com.sber.yamlprocessor.model.ContextCodes).values()}" 
                                    th:value="${code}" th:text="${code}"></option>
                        </select>
                    </div>
                </div>
                <div class="row mt-3">
                    <div class="col-md-12">
                        <label for="processDescription" class="form-label">Описание процесса</label>
                        <textarea class="form-control" id="processDescription" th:field="*{process.description}" 
                                  rows="3" placeholder="Введите описание процесса"></textarea>
                    </div>
                </div>
                <div class="row mt-3">
                    <div class="col-md-6">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="processDisabled" th:field="*{process.disabled}">
                            <label class="form-check-label" for="processDisabled">
                                Процесс отключен
                            </label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Подпроцессы -->
            <div class="form-section">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5><i class="fas fa-sitemap me-2"></i>Подпроцессы</h5>
                    <button type="button" class="btn-add" onclick="addSubprocess()">
                        Добавить подпроцесс
                    </button>
                </div>
                
                <div id="subprocesses" th:each="subprocess, iterStat : *{process.subprocess}">
                    <div class="array-item">
                        <div class="array-item-header">
                            <h6>Подпроцесс #<span th:text="${iterStat.index + 1}"></span></h6>
                            <button type="button" class="btn btn-sm btn-outline-danger remove-item-btn" onclick="removeArrayItem(this)">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6">
                                <label th:for="'subprocessId' + ${iterStat.index}" class="form-label">ID подпроцесса</label>
                                <input type="text" class="form-control" th:id="'subprocessId' + ${iterStat.index}" 
                                       th:field="*{process.subprocess[__${iterStat.index}__].id}" placeholder="Введите ID подпроцесса">
                            </div>
                            <div class="col-md-6">
                                <label th:for="'subprocessContextCode' + ${iterStat.index}" class="form-label">Код контекста</label>
                                <select class="form-select enum-select" th:id="'subprocessContextCode' + ${iterStat.index}" 
                                        th:field="*{process.subprocess[__${iterStat.index}__].contextCode}">
                                    <option value="">Выберите код контекста</option>
                                    <option th:each="code : ${T(com.sber.yamlprocessor.model.ContextCodes).values()}" 
                                            th:value="${code}" th:text="${code}"></option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="row mt-3">
                            <div class="col-md-12">
                                <label th:for="'subprocessDescription' + ${iterStat.index}" class="form-label">Описание подпроцесса</label>
                                <textarea class="form-control" th:id="'subprocessDescription' + ${iterStat.index}" 
                                          th:field="*{process.subprocess[__${iterStat.index}__].description}" 
                                          rows="2" placeholder="Введите описание подпроцесса"></textarea>
                            </div>
                        </div>
                        
                        <div class="row mt-3">
                            <div class="col-md-6">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" th:id="'subprocessDisabled' + ${iterStat.index}" 
                                           th:field="*{process.subprocess[__${iterStat.index}__].disabled}">
                                    <label class="form-check-label" th:for="'subprocessDisabled' + ${iterStat.index}">
                                        Подпроцесс отключен
                                    </label>
                                </div>
                            </div>
                        </div>

                        <!-- Триггер подпроцесса -->
                        <div class="mt-3">
                            <h6>Триггер</h6>
                            <div class="row">
                                <div class="col-md-12">
                                    <label th:for="'triggerRule' + ${iterStat.index}" class="form-label">Правило триггера</label>
                                    <input type="text" class="form-control" th:id="'triggerRule' + ${iterStat.index}" 
                                           th:field="*{process.subprocess[__${iterStat.index}__].trigger.rule}" 
                                           placeholder="Введите правило триггера">
                                </div>
                            </div>
                        </div>

                        <!-- Стадии подпроцесса -->
                        <div class="mt-3">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <h6>Стадии</h6>
                            <button type="button" class="btn-add" onclick="addStage(this)">
                                Добавить стадию
                            </button>
                            </div>
                            
                            <div class="stages-container" th:each="stage, stageIterStat : *{process.subprocess[__${iterStat.index}__].stages}">
                                <div class="array-item">
                                    <div class="array-item-header">
                                        <h6>Стадия #<span th:text="${stageIterStat.index + 1}"></span></h6>
                                        <button type="button" class="btn btn-sm btn-outline-danger remove-item-btn" onclick="removeArrayItem(this)">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </div>
                                    
                                    <div class="row">
                                        <div class="col-md-6">
                                            <label th:for="'stageId' + ${iterStat.index} + '_' + ${stageIterStat.index}" class="form-label">ID стадии</label>
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" th:id="'stageId' + ${iterStat.index} + '_' + ${stageIterStat.index}" 
                                                       th:field="*{process.subprocess[__${iterStat.index}__].stages[__${stageIterStat.index}__].id}">
                                                <label class="form-check-label" th:for="'stageId' + ${iterStat.index} + '_' + ${stageIterStat.index}">
                                                    Включена
                                                </label>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <label th:for="'stageExecutor' + ${iterStat.index} + '_' + ${stageIterStat.index}" class="form-label">Исполнитель</label>
                                            <input type="text" class="form-control" th:id="'stageExecutor' + ${iterStat.index} + '_' + ${stageIterStat.index}" 
                                                   th:field="*{process.subprocess[__${iterStat.index}__].stages[__${stageIterStat.index}__].executor}" 
                                                   placeholder="Введите исполнителя">
                                        </div>
                                    </div>
                                    
                                    <div class="row mt-3">
                                        <div class="col-md-12">
                                            <label th:for="'stageDescription' + ${iterStat.index} + '_' + ${stageIterStat.index}" class="form-label">Описание стадии</label>
                                            <textarea class="form-control" th:id="'stageDescription' + ${iterStat.index} + '_' + ${stageIterStat.index}" 
                                                      th:field="*{process.subprocess[__${iterStat.index}__].stages[__${stageIterStat.index}__].description}" 
                                                      rows="2" placeholder="Введите описание стадии"></textarea>
                                        </div>
                                    </div>

                                    <!-- Конфигуратор стадии -->
                                    <div class="mt-3">
                                        <h6>Конфигуратор</h6>
                                        <div class="row">
                                            <div class="col-md-12">
                                                <label th:for="'filterEventRule' + ${iterStat.index} + '_' + ${stageIterStat.index}" class="form-label">Правило фильтрации событий</label>
                                                <input type="text" class="form-control" th:id="'filterEventRule' + ${iterStat.index} + '_' + ${stageIterStat.index}" 
                                                       th:field="*{process.subprocess[__${iterStat.index}__].stages[__${stageIterStat.index}__].configurator.filterEventRule}" 
                                                       placeholder="Введите правило фильтрации событий">
                                            </div>
                                        </div>
                                        
                                        <div class="row mt-3">
                                            <div class="col-md-4">
                                                <div class="form-check">
                                                    <input class="form-check-input" type="checkbox" th:id="'configuratorDisabled' + ${iterStat.index} + '_' + ${stageIterStat.index}" 
                                                           th:field="*{process.subprocess[__${iterStat.index}__].stages[__${stageIterStat.index}__].configurator.disabled}">
                                                    <label class="form-check-label" th:for="'configuratorDisabled' + ${iterStat.index} + '_' + ${stageIterStat.index}">
                                                        Конфигуратор отключен
                                                    </label>
                                                </div>
                                            </div>
                                            <div class="col-md-4">
                                                <div class="form-check">
                                                    <input class="form-check-input" type="checkbox" th:id="'configuratorInterrupted' + ${iterStat.index} + '_' + ${stageIterStat.index}" 
                                                           th:field="*{process.subprocess[__${iterStat.index}__].stages[__${stageIterStat.index}__].configurator.interrupted}">
                                                    <label class="form-check-label" th:for="'configuratorInterrupted' + ${iterStat.index} + '_' + ${stageIterStat.index}">
                                                        Прерываемый
                                                    </label>
                                                </div>
                                            </div>
                                            <div class="col-md-4">
                                                <div class="form-check">
                                                    <input class="form-check-input" type="checkbox" th:id="'configuratorMultiple' + ${iterStat.index} + '_' + ${stageIterStat.index}" 
                                                           th:field="*{process.subprocess[__${iterStat.index}__].stages[__${stageIterStat.index}__].configurator.multiple}">
                                                    <label class="form-check-label" th:for="'configuratorMultiple' + ${iterStat.index} + '_' + ${stageIterStat.index}">
                                                        Множественный
                                                    </label>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

                <!-- Кнопки управления -->
                <div class="d-flex justify-content-between mt-4">
                    <a href="/yaml" class="btn-secondary-modern">
                        Отмена
                    </a>
                    <button type="submit" class="btn-modern">
                        Сохранить файл
                    </button>
                </div>
            </form>
            </div>
        </div>
    </div>

    <!-- Шаблоны для динамического добавления элементов -->
    <template id="subprocessTemplate">
        <div class="array-item">
            <div class="array-item-header">
                <h6>Новый подпроцесс</h6>
                <button type="button" class="btn btn-sm btn-outline-danger remove-item-btn" onclick="removeArrayItem(this)">
                    <i class="fas fa-trash"></i>
                </button>
            </div>
            <!-- Содержимое подпроцесса будет добавлено через JavaScript -->
        </div>
    </template>

    <template id="stageTemplate">
        <div class="array-item">
            <div class="array-item-header">
                <h6>Новая стадия</h6>
                <button type="button" class="btn btn-sm btn-outline-danger remove-item-btn" onclick="removeArrayItem(this)">
                    <i class="fas fa-trash"></i>
                </button>
            </div>
            <!-- Содержимое стадии будет добавлено через JavaScript -->
        </div>
    </template>

    <script>
        function addSubprocess() {
            // Реализация добавления подпроцесса
            console.log('Добавление подпроцесса');
        }

        function addStage(button) {
            // Реализация добавления стадии
            console.log('Добавление стадии');
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Добавляем анимации при загрузке страницы
        document.addEventListener('DOMContentLoaded', function() {
            // Анимация появления элементов
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.style.opacity = '1';
                        entry.target.style.transform = 'translateY(0)';
                    }
                });
            });

            document.querySelectorAll('.fade-in-up').forEach(el => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(30px)';
                el.style.transition = 'all 0.6s ease-out';
                observer.observe(el);
            });
        });
    </script>
</body>
</html>
