<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список YAML файлов</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --black: #000000;
            --white: #ffffff;
            --gray-100: #f8f9fa;
            --gray-200: #e9ecef;
            --gray-300: #dee2e6;
            --gray-400: #ced4da;
            --gray-500: #adb5bd;
            --gray-600: #6c757d;
            --gray-700: #495057;
            --gray-800: #343a40;
            --gray-900: #212529;
        }

        * {
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--white);
            color: var(--black);
            min-height: 100vh;
        }

        .navbar {
            background: var(--white) !important;
            border-bottom: 2px solid var(--black);
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--black);
        }

        .nav-link {
            color: var(--gray-700) !important;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-link:hover {
            color: var(--black) !important;
        }

        .nav-link::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -5px;
            left: 50%;
            background: var(--black);
            transition: all 0.3s ease;
            transform: translateX(-50%);
        }

        .nav-link:hover::after {
            width: 100%;
        }

        .container {
            position: relative;
            z-index: 1;
        }

        .main-card {
            background: var(--white);
            border: 1px solid var(--black);
            margin-top: 2rem;
            overflow: hidden;
        }

        .page-header {
            background: var(--black);
            color: var(--white);
            padding: 1.5rem;
            margin: -1px -1px 0 -1px;
        }

        .page-header h2 {
            font-weight: 400;
            margin: 0;
            font-size: 1.5rem;
        }

        .btn-modern {
            background: var(--white);
            border: 1px solid var(--black);
            padding: 8px 16px;
            font-weight: 400;
            color: var(--black);
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-modern:hover {
            background: var(--black);
            color: var(--white);
            text-decoration: none;
        }

        .file-card {
            background: var(--white);
            border: 1px solid var(--black);
            transition: all 0.2s ease;
            position: relative;
        }

        .file-card:hover {
            border-color: var(--gray-500);
        }

        .file-icon {
            width: 40px;
            height: 40px;
            background: var(--white);
            border: 1px solid var(--black);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
            transition: all 0.2s ease;
        }

        .file-card:hover .file-icon {
            background: var(--black);
            color: var(--white);
        }

        .file-title {
            font-weight: 400;
            color: var(--black);
            margin-bottom: 0.5rem;
            font-size: 1rem;
        }

        .file-description {
            color: var(--gray-600);
            font-size: 0.875rem;
        }

        .btn-group-modern {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .btn-action {
            border: 1px solid var(--black);
            padding: 4px 8px;
            font-weight: 400;
            font-size: 0.75rem;
            transition: all 0.2s ease;
            background: var(--white);
            color: var(--black);
            text-decoration: none;
            display: inline-block;
        }

        .btn-view:hover {
            background: var(--black);
            color: var(--white);
            text-decoration: none;
        }

        .btn-edit:hover {
            background: var(--gray-800);
            color: var(--white);
            text-decoration: none;
        }

        .btn-delete:hover {
            background: var(--black);
            color: var(--white);
            text-decoration: none;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 2rem;
            color: var(--gray-600);
        }

        .empty-icon {
            width: 80px;
            height: 80px;
            background: var(--white);
            border: 1px solid var(--black);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
        }

        .empty-icon i {
            font-size: 2rem;
            color: var(--black);
        }

        .alert-modern {
            border: 1px solid var(--black);
        }

        .alert-success {
            background: var(--white);
            color: var(--black);
            border-color: var(--black);
        }

        .alert-danger {
            background: var(--white);
            color: var(--black);
            border-color: var(--black);
        }

        .modal-content {
            background: var(--white);
            border: 1px solid var(--black);
        }

        .modal-header {
            border-bottom: 1px solid var(--black);
        }

        .modal-footer {
            border-top: 1px solid var(--black);
        }

        .btn-close {
            filter: none;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in-up {
            animation: fadeInUp 0.6s ease-out;
        }

        .stagger-1 { animation-delay: 0.1s; }
        .stagger-2 { animation-delay: 0.2s; }
        .stagger-3 { animation-delay: 0.3s; }
        .stagger-4 { animation-delay: 0.4s; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-file-code me-2"></i>YAML Processor
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/yaml">
                    <i class="fas fa-list me-1"></i>Список файлов
                </a>
                <a class="nav-link" href="/yaml/new">
                    <i class="fas fa-plus me-1"></i>Новый файл
                </a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div th:if="${success}" class="alert alert-success alert-modern alert-dismissible fade show fade-in-up" role="alert">
            <i class="fas fa-check-circle me-2"></i>
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div th:if="${error}" class="alert alert-danger alert-modern alert-dismissible fade show fade-in-up" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i>
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="main-card fade-in-up">
            <div class="page-header">
                <div class="d-flex justify-content-between align-items-center">
                    <h2><i class="fas fa-file-code me-3"></i>YAML файлы</h2>
                    <a href="/yaml/new" class="btn-modern">
                        Создать новый файл
                    </a>
                </div>
            </div>

            <div class="p-4">
                <div th:if="${files != null and !files.empty}" class="row g-4">
                    <div th:each="file, iterStat : ${files}" class="col-md-6 col-lg-4 fade-in-up" th:classappend="'stagger-' + ${iterStat.index + 1}">
                        <div class="file-card h-100 p-4">
                            <div class="file-icon">
                                <i class="fas fa-file-code text-white"></i>
                            </div>
                            <h5 class="file-title" th:text="${file}"></h5>
                            <p class="file-description">
                                YAML файл конфигурации процесса
                            </p>
                            <div class="btn-group-modern mt-3">
                                <a th:href="@{'/yaml/view/' + ${file}}" class="btn-action btn-view">
                                    Просмотр
                                </a>
                                <a th:href="@{'/yaml/edit/' + ${file}}" class="btn-action btn-edit">
                                    Редактировать
                                </a>
                                <button type="button" class="btn-action btn-delete" 
                                        th:data-filename="${file}" onclick="deleteFile(this.dataset.filename)">
                                    Удалить
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div th:if="${files == null or files.empty}" class="empty-state">
                    <div class="empty-icon">
                        <i class="fas fa-folder-open"></i>
                    </div>
                    <h4 class="mb-3">Нет YAML файлов</h4>
                    <p class="mb-4">Создайте первый YAML файл для начала работы</p>
                    <a href="/yaml/new" class="btn-modern">
                        Создать файл
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно подтверждения удаления -->
    <div class="modal fade" id="deleteModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Подтверждение удаления</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>Вы уверены, что хотите удалить файл <strong id="fileName"></strong>?</p>
                    <p class="text-danger"><small>Это действие нельзя отменить.</small></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <form id="deleteForm" method="post" style="display: inline;">
                        <button type="submit" class="btn btn-danger">Удалить</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        function deleteFile(filename) {
            document.getElementById('fileName').textContent = filename;
            document.getElementById('deleteForm').action = '/yaml/delete/' + filename;
            new bootstrap.Modal(document.getElementById('deleteModal')).show();
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Добавляем анимации при загрузке страницы
        document.addEventListener('DOMContentLoaded', function() {
            // Анимация появления элементов
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.style.opacity = '1';
                        entry.target.style.transform = 'translateY(0)';
                    }
                });
            });

            document.querySelectorAll('.fade-in-up').forEach(el => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(30px)';
                el.style.transition = 'all 0.6s ease-out';
                observer.observe(el);
            });
        });
    </script>
</body>
</html>
